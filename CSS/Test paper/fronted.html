        .Small button {

            color: ghostwhite;
            font-size: large;
            border: 0px silver solid;
            border-radius: 0px 0px 20px 20px;
        }

        .Main {
            display: flex;
            justify-content: space-evenly;
        }

        .Medium:hover {
            transform: scaleY(1.1) rotate(2deg);
        }

        .Small:hover {
            transform: scaleX(1.1) rotate(1deg);
        }
    </style>
