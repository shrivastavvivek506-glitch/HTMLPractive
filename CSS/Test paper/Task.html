<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .id-card {
            width: 350px;
            margin: 50px auto;
            background-color: white;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
        }

        .header {
            text-align: center;
            background-color: #333;
            color: white;
            padding: 15px;
        }

        .photo {
            width: 100px;
            height: 100px;
            border: 1px solid #333;
            display: block;
            margin: 20px auto;
            object-fit: cover;
        }

        .details {
            font-size: 16px;
            line-height: 1.8;
        }

        .details strong {
            display: inline-block;
            width: 120px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid #ccc;
            font-size: 13px;
        }

        #hr {

            background-color: aquamarine;
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div id="hr">
        Create By :-Vivek Shrivastav
    </div>

    <div class="id-card">

        <div class="header">
            <h2>SHOBHIT UNIVERSITY STUDENT ID CARD</h2>
            <p> Computational Sciences Institute</p>
        </div>

        <img src="student.jpg" alt="Student Photo" class="photo">

        <div class="details">
            <p><strong>Full Name:</strong> Vivek Shrivastav</p>

            <p><strong>Course:</strong> BCA</p>

            <p><strong>Date of Birth:</strong> 30-10-2006</p>

            <p><strong>Address:</strong><br>
                Modipuram NH58 ,<br>
                Meerut, Uttar Pradesh
            </p>
        </div>

        <div class="footer">
            Student Identification Card
        </div>

    </div>

</body>

</html>
