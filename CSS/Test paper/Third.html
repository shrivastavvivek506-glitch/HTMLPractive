<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID</title>
</head>
<style>
   
    p {
        color: red;
        background-color: aqua;
        border: 5px solid rgb(15, 5, 5);
        font-size: 30px;
        

    }

    .container {
        display: grid;
        grid-template-columns: 1fr 3fr 1fr;
        row-gap: 20px;
        column-gap: 50px;
    }

    .containe{
        display: grid;
        grid-template-columns: repeat(4,1fr);
        row-gap: 20px;
        column-gap: 50px;

    }

     .contain{
        
        display: grid;
        grid-template-columns: 100px 300px 400px;
        row-gap: 20px;
        column-gap: 50px;

    }
</style>

<body>

    <div class="main">
        <div class="container">
            <p>Box 1</p>
            <p>Box 2</p>
            <p>Box 3</p>

        </div>

        <div class="containe">
            <p>Box 4</p>
            <p>Box 5</p>
            <p>Box 6</p>
            <p>Test</p>
        </div>
        <div class="contain">
            <p>Box 7</p>
            <p>Box 8</p>
            <p>Box 9</p>
        </div>
    </div>


</body>

</html>
