<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend</title>

    <style>
        .logo {
            height: 60px;
            width: 200px;
            margin: auto;
            display: block;
        }

        .hr {
            display: flex;
            margin-left: 55px;
            gap: 200px;
        }

        .hr li {
            list-style: none;
            background-color: whitesmoke;
        }

        .hr li a {
            text-decoration: none;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 100px;
        }

        #main {
            width: 50%;
        }

        .hi {
            font-size: 50px;
            margin: 0;
        }

        #hi {
            color: blue;
            font-size: 50px;
            margin: 0;
        }

        p {
            font-size: 20px;
        }

        input {
            height: 45px;
            width: 350px;
            border-radius: 50px;
            border: 1px solid #ccc;
            padding-left: 20px;
            font-size: 16px;
        }
        #id {
            height: 50px;
            background-color: blue;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 20px;
        }

        .is {
            width: 50%;
        }

        .is img {
            width: 550px;
            height: auto;
            display: block;
        }
    </style>
</head>

<body>


    <img class="logo" src="./1773754004919-angel-one-logo.png" alt="Angel One">

    <hr>

    <div>
        <ul class="hr">
            <li><a href="">Home</a></li>
            <li><a href="">SIP & FD</a></li>
            <li><a href="">Trading</a></li>
            <li><a href="">Customer Support</a></li>
        </ul>
    </div>

    <div class="hero">

        <div id="main">

            <h1 class="hi">
                Open Your
            </h1>

            <h2 id="hi">
                Free Demat Account
            </h2>

            <p>
                Invest in stocks, mutual funds and IPOs with ease
            </p>

            <input type="tel" placeholder="Enter your mobile number">

            <button id="id">
                Open Demat Account
            </button>

            <p>
                By continuing, you agree to our
                <a href="">Terms of Service</a> &
                <a href="">Privacy Policy</a>
            </p>

        </div>

        <div class="is">
            <img src="https://w3assets.angelone.in/wp-content/uploads/1780292910073-sem-ppc-headers.png"
                alt="Laptop and Mobile">
        </div>

    </div>

</body>

</html>
