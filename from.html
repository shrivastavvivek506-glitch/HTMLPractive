<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>From</title>
</head>
<body>
    <h1 style="text-align: center;">Form</h1>
    <hr>
    <form>
        <label for="name">Name:</label>
            <input type="text" id="name" name="name">
        <br><br>
        <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
            <br><br>
            <label for="datetime">Date & Time:</label>
            <input type="datetime-local" id="datetime" name="datetime">
        <br><br>
        <label for="text">Address:</label>
        <textarea name="text" id="text" cols="15" rows="10"></textarea>
        <br><br>
        <label for="file">Upload File:</label>
        <input type="file" name="file" id="file">
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" name="gender" value="male">male
        <input type="radio" name="gender" value="female">female
        <input type="radio" name="gender" value="other">other
        <br><br>
        <label for="hobbies">Hobbies:</label>
        <input type="radio" name="hobbies" value="reading">Reading
        <input type="radio" name="hobbies" value="writing">Writing
        <input type="radio" name="hobbies" value="coding">Coding
        <br><br>
        <label for="country">Country:</label>
        <select name="country" id="country">
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="japan">Japan</option>
        </select>
        <br><br>
        <feedback for="feedback">Feedback:</label>
        <textarea name="feedback" id="feedback" cols="15" rows="10"></textarea>
        <button type="submit">Submit</button>

    </form>
</body>
</html>
